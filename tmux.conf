# Personal tmux configuration
# Prefix: Ctrl+b

# Mouse selection and pane resizing
set -g mouse on

# Number windows and panes from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Improve terminal color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# More responsive Escape key (important for Neovim)
set -sg escape-time 10

# Keep more scrollback history
set -g history-limit 20000

# Make pane boundaries easier to identify
set -g pane-border-status off
set -g pane-active-border-style "fg=green"

# Easier-to-remember split shortcuts
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows inherit the current directory
bind c new-window -c "#{pane_current_path}"

# Reload this configuration: Ctrl+b, then r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
